name: Verify and publish patched driver trial
on:
  push:
    branches: [trial/github-packages-lock-timeout]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            version: '8.4.8'
          - db: mysql
            version: '5.7.44'
          - db: mariadb
            version: '10.11'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Isolate legacy SQL compatibility from old server TLS ciphers
        if: matrix.version == '5.7.44'
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('r2dbc-mysql/src/test/java/io/asyncer/r2dbc/mysql/internal/util/TestContainerExtension.java')
          s = p.read_text()
          old = '.withCommand("--local-infile=true",'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '.withCommand("--skip-ssl", "--local-infile=true",'))
          PYCODE
      - name: Unit tests, checkstyle and session integration tests
        run: |
          ./mvnw -B -pl r2dbc-mysql -am verify -Dmaven.javadoc.skip=true \
            -Dit.test=SessionStateIntegrationTest -Dfailsafe.failIfNoSpecifiedTests=false \
            -Dtest.db.type=${{ matrix.db }} -Dtest.db.version=${{ matrix.version }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.db }}-${{ matrix.version }}
          path: |
            r2dbc-mysql/target/surefire-reports/
            r2dbc-mysql/target/failsafe-reports/
      - uses: actions/upload-artifact@v4
        if: matrix.db == 'mysql' && matrix.version == '8.4.8'
        with:
          name: tested-driver
          path: |
            r2dbc-mysql/target/r2dbc-mysql-1.4.3-plato.1.jar
            r2dbc-mysql/target/r2dbc-mysql-1.4.3-plato.1-sources.jar
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
      - uses: actions/download-artifact@v4
        with:
          name: tested-driver
          path: tested-driver
      - name: Publish the tested artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw -B org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy-file \
            -Dfile=tested-driver/r2dbc-mysql-1.4.3-plato.1.jar \
            -Dsources=tested-driver/r2dbc-mysql-1.4.3-plato.1-sources.jar \
            -DpomFile=r2dbc-mysql/pom.xml -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/plato-corp/r2dbc-mysql
      - name: Resolve from a fresh consumer repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw -B -f trial-consumer/pom.xml \
            -Dmaven.repo.local="$RUNNER_TEMP/consumer-repository" \
            dependency:build-classpath -Dmdep.outputFile=classpath.txt
          downloaded="$RUNNER_TEMP/consumer-repository/io/asyncer/r2dbc-mysql/1.4.3-plato.1/r2dbc-mysql-1.4.3-plato.1.jar"
          cmp tested-driver/r2dbc-mysql-1.4.3-plato.1.jar "$downloaded"
          sha256sum "$downloaded" > trial-consumer/SHA256SUMS
          javac -cp "$(cat trial-consumer/classpath.txt)" trial-consumer/Smoke.java
      - name: Test downloaded package against MySQL 8.4.8
        run: |
          docker run -d --name trial-mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=trial-only mysql:8.4.8
          for i in {1..60}; do
            if docker exec trial-mysql mysqladmin ping -uroot -ptrial-only --silent; then break; fi
            sleep 2
          done
          java -cp "trial-consumer:$(cat trial-consumer/classpath.txt)" Smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-consumer-proof
          path: trial-consumer/SHA256SUMS
