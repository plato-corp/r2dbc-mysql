name: Verify published driver consumer
on:
  push:
    branches: [verify/github-packages-consumer]
permissions:
  contents: read
  packages: read
jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
      - name: Resolve published version with fresh Maven cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw -B -f trial-consumer/pom.xml \
            -Dmaven.repo.local="$RUNNER_TEMP/consumer-repository" \
            dependency:build-classpath -Dmdep.outputFile=classpath.txt
          downloaded="$RUNNER_TEMP/consumer-repository/io/asyncer/r2dbc-mysql/1.4.3-plato.1/r2dbc-mysql-1.4.3-plato.1.jar"
          echo "26ad6cc0abb3fe1aa9bac3b6ef44e2ae03d7410cea7e0467bcc8b042475b4982  $downloaded" | sha256sum -c -
          javac -cp "$(cat trial-consumer/classpath.txt)" trial-consumer/Smoke.java
      - name: Test downloaded package against ready MySQL 8.4.8
        run: |
          docker run -d --name trial-mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=trial-only mysql:8.4.8
          ready=false
          for i in {1..60}; do
            if docker exec trial-mysql mysql --protocol=TCP -h127.0.0.1 -uroot -ptrial-only -e 'SELECT 1'; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs trial-mysql; exit 1; fi
          java -cp "trial-consumer:$(cat trial-consumer/classpath.txt)" Smoke
